<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 助手</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#eef1f8;--surface:#fff;--border:#dde3ef;
  --text:#1b2540;--muted:#5a6a8a;--faint:#8a9ab8;
  --blue:#1a4fc4;--bbg:#ecf1fd;
}
body{display:flex;flex-direction:column;height:100vh;
  font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);}

/* header */
#hd{background:linear-gradient(135deg,#1a3a8f,#2563eb);padding:12px 16px;
  display:flex;align-items:center;gap:8px;flex-shrink:0;}
#hd-icon{font-size:18px;}
#hd-title{font-size:13px;font-weight:700;color:#fff;}
#hd-sub{font-size:10px;color:rgba(255,255,255,.5);margin-left:auto;font-family:'DM Mono',monospace;}

/* no key banner */
#no-key{display:none;flex-direction:column;align-items:center;justify-content:center;
  flex:1;gap:12px;padding:24px;text-align:center;}
#no-key .icon{font-size:36px;}
#no-key .msg{font-size:13px;color:var(--muted);line-height:1.6;}
#no-key .hint{font-size:12px;color:var(--faint);background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:10px 14px;}

/* messages */
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;word-break:break-word;}
.msg.user{align-self:flex-end;background:#1a4fc4;color:#fff;border-bottom-right-radius:4px;}
.msg.ai{align-self:flex-start;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg.ai.loading{color:var(--faint);}

/* input area */
#input-area{padding:12px;background:var(--surface);border-top:1px solid var(--border);
  display:flex;gap:8px;flex-shrink:0;}
#inp{flex:1;padding:9px 13px;border:1px solid var(--border);border-radius:10px;
  font-size:13px;font-family:'Noto Sans TC',sans-serif;color:var(--text);
  background:var(--bg);outline:none;resize:none;}
#inp:focus{border-color:var(--blue);}
#send-btn{width:38px;height:38px;border-radius:10px;border:none;
  background:#1a4fc4;color:#fff;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s;}
#send-btn:hover{background:#1a3a8f;}
#send-btn:disabled{background:var(--border);cursor:default;}
</style>
</head>
<body>

<div id="hd">
  <span id="hd-icon">🤖</span>
  <span id="hd-title">AI 採購助手</span>
  <span id="hd-sub">食材成本儀表板</span>
</div>

<div id="no-key">
  <div class="icon">🔑</div>
  <div class="msg">尚未設定 API Key<br>請在主頁面點選 <strong>⚙️ 設定</strong> 填入你的 Key</div>
  <div class="hint">設定完成後重新開啟 AI 助手即可使用</div>
</div>

<div id="msgs"></div>

<div id="input-area">
  <textarea id="inp" rows="1" placeholder="詢問採購建議、價格分析…" oninput="autoH(this)"></textarea>
  <button id="send-btn" onclick="send()">➤</button>
</div>

<script>
const KEY   = localStorage.getItem('ai_key')   || '';
const EP    = localStorage.getItem('ai_ep')    || 'https://api.openai.com/v1/chat/completions';
const MODEL = localStorage.getItem('ai_model') || 'gpt-4o-mini';

const SYSTEM = `你是一個食材成本波動儀表板的 AI 採購助手。
這個儀表板追蹤 20 種食材（雞蛋、牛奶、起司、豬絞肉、鮭魚、蝦仁、雞胸肉、豆腐、菇類、馬鈴薯、洋蔥、紅蘿蔔、高麗菜、番茄、白米、麵粉、食用油、醬油、砂糖、奶油）
在 8 個供應商（海洋直送、大全農產、長榮食材、益昌、台農、豐收行、鮮供應、綠源）的 2026 年採購價格。
請協助用戶解讀數據、分析波動原因、提出採購建議。請用繁體中文回答，語氣簡潔專業。`;

const history = [{role:'system', content: SYSTEM}];

if(!KEY){
  document.getElementById('no-key').style.display='flex';
  document.getElementById('msgs').style.display='none';
  document.getElementById('input-area').style.display='none';
} else {
  addMsg('ai','👋 你好！我是採購 AI 助手。你可以問我食材價格分析、供應商比較、建議採購策略等問題。');
}

function addMsg(role, text){
  const div=document.createElement('div');
  div.className='msg '+role;
  div.textContent=text;
  document.getElementById('msgs').appendChild(div);
  document.getElementById('msgs').scrollTop=9999;
  return div;
}

async function send(){
  const inp=document.getElementById('inp');
  const text=inp.value.trim();
  if(!text) return;
  inp.value=''; inp.style.height='';
  document.getElementById('send-btn').disabled=true;

  addMsg('user', text);
  history.push({role:'user', content: text});

  const loading=addMsg('ai','…');
  loading.classList.add('loading');

  try{
    const res=await fetch(EP,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},
      body:JSON.stringify({model:MODEL, messages:history})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    const reply=data.choices?.[0]?.message?.content || '（沒有回應）';
    loading.classList.remove('loading');
    loading.textContent=reply;
    history.push({role:'assistant', content: reply});
  } catch(e){
    loading.classList.remove('loading');
    loading.textContent='❌ 發生錯誤：'+e.message+'。請確認 API Key 與 Endpoint 是否正確。';
  }
  document.getElementById('send-btn').disabled=false;
  inp.focus();
}

document.getElementById('inp').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});

function autoH(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}
</script>
</body>
</html>
